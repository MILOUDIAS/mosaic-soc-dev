meta:
  version: 3
  # EXPERIMENTAL -- NOT A TAPEOUT PATH.
  #
  # This config deliberately runs OUTSIDE the PHYSICAL_BUNDLE preflight gate
  # (flow/librelane/scripts/preflight.py), which exists to stop a stale or
  # unattested RTL blob being mistaken for a tapeout input. Nothing produced
  # from this file is attested, and DRC/LVS/antenna are skipped on purpose to
  # shorten the loop. Use config_classic.yaml + a real bundle for signoff.
  flow: Classic

DESIGN_NAME: mosaic_block_a

# Fed as SystemVerilog through slang rather than a pre-flattened blob: sv2v is
# broken in this environment and the design elaborates cleanly under slang.
USE_SLANG: true
SLANG_ARGUMENTS:
- --allow-use-before-declare
- --relax-enum-conversions
- --relax-string-conversions
- --allow-hierarchical-const
- --compat
- vcs
# Drops SystemVerilog assertions. Without this, slang emits $check cells (97
# here, all from pulp rr_arb_tree) that have no physical cell to map to and
# stall the flow at Checker.YosysUnmappedCells. Note slang already defines
# SYNTHESIS implicitly (see --no-synthesis-define), so defining it by hand does
# nothing -- these assertions are not `ifndef SYNTHESIS guarded.
- --ignore-assertions

# VERILOG_FILES and VERILOG_INCLUDE_DIRS are NOT listed here.
#
# They used to be ~526 absolute paths into a content-addressed FuseSoC build
# directory, which meant two things: they went stale whenever the bundle hash
# moved (any template or config edit), and on any other machine every one of
# them pointed at a directory that does not exist -- so this config was not
# reproducible by anyone but its author.
#
# flow/librelane/scripts/gen_filelist.py now resolves both lists from the
# manifest at run time, exactly as tb/mosaic_soc/gen_filelist.py has always
# done for the simulation flow. run_signoff.sh calls it and merges the result
# into the config it hands to LibreLane.
#
# To harden by hand, generate the fragment first:
#   python3 flow/librelane/scripts/gen_filelist.py "$PWD" \
#       --manifest build/mosaic/<bundle>/manifest.json \
#       --build-root build/mosaic/<bundle>/runs/fusesoc.*/build \
#       --output /tmp/files.yaml

# ORFS area script (strash; dch; map; topo; buffer; upsize; dnsize) instead of
# the default 'AREA 0', whose fraig_store/retime/amap chain ran for over an hour
# on this ~200k-cell design without finishing. This is a turnaround-time choice,
# not a quality one -- expect a somewhat larger netlist than AREA 0 would give.
SYNTH_STRATEGY: AREA 3

# Two residual yosys check problems are downgraded to warnings. BOTH ARE
# PRE-EXISTING x-heep artifacts, not consequences of the area work, and both
# are recorded rather than hidden:
#   1. power_manager.external_subsystem_pwr_ctrl_o is undriven because this SoC
#      has EXTERNAL_DOMAINS = 0; the port is still declared at width 1.
#   2. One $or cell's output Y also carries a constant 1 driver.
# Neither blocks placement. ERROR_ON_UNMAPPED_CELLS stays True -- an unmapped
# cell has no physical master and genuinely cannot be placed, so that one must
# keep failing the flow.
ERROR_ON_SYNTH_CHECKS: false

PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# 20 MHz. The GF180 SRAM cut specifies Tcyc = 55.6 ns (~18 MHz), so the whole
# design is paced by the scratchpad, not by the cores. Asking for the 50 MHz of
# config_classic.yaml here would be asking the tool to close something the
# macro cannot do.
CLOCK_PORT: clk_i
# 10 MHz. Was 50 ns, which is FASTER than the SRAM macro's 55.6 ns Tcyc and
# failed slow-corner setup (-1.315 ns WNS, -8.129 ns TNS at max_ss_125C_4v50).
# The macro is gone with lever 1, so nothing forces a tight period; relaxing it
# lets the optimizer stop spending area on timing-repair buffers, which were
# 0.326 mm2 -- 24% of all standard-cell area.
CLOCK_PERIOD: 100

VDD_NETS: [VDD]
GND_NETS: [VSS]

# Achieved utilization was only 54.7% against a target of 40, so the die was
# 2.5x the placed area purely by configuration.
# 65, not 75. FP_CORE_UTIL sizes the die from the PRE-CTS cell area; clock tree
# and timing repair then add cells inside that fixed die. The previous run grew
# 0.877 -> 1.346 mm2 (1.53x), so starting at 75% lands near 98% and
# DPL-0036 "Detailed placement failed" -- the legalizer cannot place them.
# 65% leaves headroom for the post-CTS growth to land near 75-80%.
# 70. Path B cut synthesis area 1.061 -> 0.722 mm2, so the same absolute
# post-CTS growth is a larger fraction of a smaller die. 70 targets ~83% final
# utilization -- above the 77.8% that legalized last time, so DPL-0036 is a
# real risk; if it fires, 65 is the safe fallback at ~1.34 mm2 die.
# Block A is a FIXED slot: a quarter of the 2235 x 2235 um shared project
# area = 1117.5 um square. Relative sizing gave 1107.9 x 1125.8 um -- the area
# fitted (1.2473 vs 1.2488 mm2) but the die was 8.3 um too TALL for the slot.
# An MPW block must match its slot exactly, so size it absolutely.
FP_SIZING: absolute
DIE_AREA: [0, 0, 1117.5, 1117.5]
CORE_AREA: [10, 10, 1107.5, 1107.5]
PL_TARGET_DENSITY_PCT: 76
GRT_ALLOW_CONGESTION: true

# Measured hold WNS was +0.33 to +1.53 ns, i.e. margin to give back.
PL_RESIZER_HOLD_SLACK_MARGIN: 0.05
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.05

PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# NO CORE RING. Straps on Metal4/Metal5 (PDN_VERTICAL/HORIZONTAL_LAYER) carry
# power; Metal2/Metal3 are left entirely to the router.
#
# History, because both alternatives are wrong in an instructive way:
#  - Ring on Metal2/Metal3 (inherited from config_classic.yaml) put a 25 um
#    shape inside the router's own layer range. Every detailed-routing
#    violation was a signal-to-VDD short on Metal3 along the ring, and DRT
#    thrashed for 3+ hours without converging.
#  - Ring on Metal4/Metal5 collides with the straps already there:
#    "PDN-0186 Connect between layers Metal4 and Metal5 already exists", plus
#    "PDN-0239 Ring shape falls outside the die bounds" -- 25 um does not fit.
# A core ring belongs to the chip-level flow (config.yaml + the pad frame),
# not to a standalone macro harden.
PDN_CORE_RING: false

# The 256 B scratchpad: four 64x8 cuts, one per byte lane.
