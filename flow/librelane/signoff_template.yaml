# mosaic-technology: gf180mcu
# Signoff hardening TEMPLATE -- the design-INDEPENDENT part.
#
# Phase 1 measured which knobs a second design actually needs. Of 41 keys in
# the Block A signoff config, 35 were byte-identical in Block B's, and the
# differences were the design name and the floorplan. The PDN geometry, the
# hold-slack margins, the core-ring arrangement, the slang flags and every
# check setting carried over untouched and produced a clean result on a design
# they were never tuned for.
#
# So those 35 live here, comments and all, and the five design-specific keys --
# DESIGN_NAME, CLOCK_PERIOD, FP_SIZING, DIE_AREA, CORE_AREA -- are appended by
# `oh-my-soc physical-intent harden`, which derives them from the SoC config
# and its objectives. CLOCK_PERIOD was identical in both designs only because
# both chose 10 MHz; it is derived, not invariant.
#
# Editing a value here changes it for EVERY design. If a knob turns out to be
# design-specific after all, that is a finding: move it into the derivation
# rather than forking this file.

meta:
  version: 3
  # SIGNOFF configuration -- runs the FULL flow with NOTHING skipped.
  #
  # Every earlier experimental run skipped DRC, LVS, XOR and IR drop to shorten
  # the loop. This one runs them, because "0 routing DRC" is a router result and
  # says nothing about the signoff decks. It is still outside the
  # PHYSICAL_BUNDLE attestation gate, so a clean result here is evidence, not
  # an attested tapeout input.
  #
  # This config still runs OUTSIDE the PHYSICAL_BUNDLE preflight gate
  # (flow/librelane/scripts/preflight.py), which exists to stop a stale or
  # unattested RTL blob being mistaken for a tapeout input. Nothing produced
  # from this file is attested, so a clean DRC/LVS here is evidence about the
  # layout, not a tapeout sign-off. Use config_classic.yaml + a real bundle for
  # that.
  flow: Classic

# Fed as SystemVerilog through slang rather than a pre-flattened blob: sv2v is
# broken in this environment and the design elaborates cleanly under slang.
USE_SLANG: true
SLANG_ARGUMENTS:
- --allow-use-before-declare
- --relax-enum-conversions
- --relax-string-conversions
- --allow-hierarchical-const
- --compat
- vcs
# Drops SystemVerilog assertions. Without this, slang emits $check cells (97
# here, all from pulp rr_arb_tree) that have no physical cell to map to and
# stall the flow at Checker.YosysUnmappedCells. Note slang already defines
# SYNTHESIS implicitly (see --no-synthesis-define), so defining it by hand does
# nothing -- these assertions are not `ifndef SYNTHESIS guarded.
- --ignore-assertions

# VERILOG_FILES and VERILOG_INCLUDE_DIRS are NOT listed here.
#
# They used to be ~526 absolute paths into a content-addressed FuseSoC build
# directory, which meant two things: they went stale whenever the bundle hash
# moved (any template or config edit), and on any other machine every one of
# them pointed at a directory that does not exist -- so this config was not
# reproducible by anyone but its author.
#
# flow/librelane/scripts/gen_filelist.py now resolves both lists from the
# manifest at run time, exactly as tb/mosaic_soc/gen_filelist.py has always
# done for the simulation flow. run_signoff.sh calls it and merges the result
# into the config it hands to LibreLane.
#
# To harden by hand, generate the fragment first:
#   python3 flow/librelane/scripts/gen_filelist.py "$PWD" \
#       --manifest build/mosaic/<bundle>/manifest.json \
#       --build-root build/mosaic/<bundle>/runs/fusesoc.*/build \
#       --output /tmp/files.yaml

# ORFS area script (strash; dch; map; topo; buffer; upsize; dnsize) instead of
# the default 'AREA 0', whose fraig_store/retime/amap chain ran for over an hour
# on this ~200k-cell design without finishing. This is a turnaround-time choice,
# not a quality one -- expect a somewhat larger netlist than AREA 0 would give.
SYNTH_STRATEGY: AREA 3

# A synth check error fails this run. The fast configs set this false and
# called the 108 remaining problems "pre-existing x-heep artifacts" -- that was
# wrong, and turning the gate back on is what proved it. All 108 came from this
# repo's own knob code (bug 28, 2026-08-01):
#   107 x rv_timer_tl_h2d used-but-undriven, from the soc.ao_rv_timer: false
#        branch absorbing h2d into an unused signal instead of tying it off.
#     1 x a constant 1 conflicting with an $or output, traced to
#        soc_ctrl_reg_top.sv:65 -- the soc.dma: none branch drove
#        ao_peripheral_slv_rsp[DMA_CH0_IDX], and DMA_CH0_IDX (a DMA-internal
#        channel index) is 0, the same slot as SOC_CTRL_IDX. soc_ctrl's read
#        responses were being overwritten with error=1, rdata=0.
# Both are fixed in ao_peripheral_subsystem.sv.tpl. The gate stays on so the
# next one is found here rather than in a GDS.
ERROR_ON_SYNTH_CHECKS: true

# ---- ELECTRICAL REPAIR (max slew / cap / fanout) -----------------------------
# The first signoff run closed timing at every corner and still reported 2 889
# max-slew, 411 max-fanout and 27 max-cap violations. No DRC or LVS deck looks
# at those, and setup/hold slack does not imply them.
#
# Why they matter, concretely: the worst measured slew was 6.07 ns, against a
# reported limit of 4.0 ns -- and the right answer is to measure against the
# library's own limit rather than a blanket default under it (see
# MAX_TRANSITION_CONSTRAINT / MAX_CAPACITANCE_CONSTRAINT below).
#
# CORRECTED 2026-08-16. This paragraph used to say "every cell in this library
# declares max_transition 4.0 ns and the largest CHARACTERISED input transition
# is 4.756 ns. Beyond that the delay numbers are extrapolated." Both halves are
# wrong: max_transition is per-pin AND per-corner (4.0 at tt_025C_5v00, 7.0 at
# ss_125C_4v50, 2.6 at ff_n40C_5v50), and 4.756 is a max_capacitance in pF, not
# a transition -- the characterisation tables run to 10.0 ns. Nothing this
# project has measured is anywhere near an extrapolated region. The principle
# stated above survives; the numbers it was argued with did not.
#
# Root causes, from the first run's checks.rpt:
#   * RUN_POST_GRT_DESIGN_REPAIR was FALSE. Repair ran only after global
#     placement, on estimated wire loads; nothing repaired slew/cap again once
#     CTS and real routing had happened. This is the main fix.
#   * every max-fanout violation and the worst max-cap ones are on the CLOCK
#     tree -- clkbuf leaves driving 16-18 sinks against MAX_FANOUT_CONSTRAINT
#     10, trunk buffers at 0.47 pF against a 0.2 pF limit. CTS does not honour
#     the design's fanout/cap constraints unless told, so it is told here.
RUN_POST_GRT_DESIGN_REPAIR: true

# ---- PNR_CORNERS: MEASURED INERT, KEPT ON PRINCIPLE ---------------------------
# *** CORRECTED 2026-08-13. This block previously claimed the corner set was
# one of two flow defects behind the max-slew violations, and credited it with
# a 19% reduction. THAT WAS WRONG, and the error is worth keeping visible.
#
# The 19% came from comparing blockc_u65 against blockc_mc -- a comparison in
# which the DIE also changed, because the area model had been refreshed with
# Block C's own measurement between the two runs. Two variables moved and the
# difference was attributed to one of them.
#
# The clean single-variable test: blocka_slewonly is blocka_reharden with
# PNR_CORNERS removed and nothing else changed. Exactly one differing config
# key. The resulting netlists are BYTE-IDENTICAL:
#
#     blocka_reharden   nl/mosaic_block_a.nl.v  md5 ae511ec94850fab00e212fdf370ba7b6
#     blocka_slewonly   nl/mosaic_block_a.nl.v  md5 ae511ec94850fab00e212fdf370ba7b6
#
# Every metric matches too -- setup and hold to fifteen decimal places, logic
# area to the square micrometre, slew 4, fanout 1. Setting three PnR corners
# instead of one changed NOTHING on this design.
#
# It is kept because optimising the corner you sign off at is right in
# principle and it demonstrably costs nothing here. It is NOT a fix, and
# nothing should be credited to it.
#
# Scope of the measurement, honestly: one design (mosaic_block_a), at one
# repair margin (45). Whether the corner set matters at the default margin, or
# on a design with less timing slack, is untested. `librelane/steps/openroad.py`
# really does fall back to `[DEFAULT_CORNER]` when this is unset -- that part
# of the original finding stands; what does not stand is that it mattered.
PNR_CORNERS:
  - nom_tt_025C_5v00
  - max_ss_125C_4v50
  - min_ff_n40C_5v50

# ---- REPAIR MARGIN: THE ONLY REAL VARIABLE ----------------------------------
# (This heading used to end "AND IT BREAKS THE DESIGN". It does not; see the
#  2026-09-07 note below. The claim survived two corrections before it died.)
# Sized from the measured estimate-to-extracted error, not guessed. Repair
# fixes slew against GLOBALLY-ROUTED ESTIMATED parasitics; detailed routing
# then makes far more. blockc_mc at max_ss_125C_4v50:
#
#     repair_design finds                                47 violations
#     STA after repair, before detailed routing           11
#     STA after detailed routing and extraction          826
#
# The 11 pins that violate BOTH before and after routing give the ratio:
#
#     _55370_/ZN  4.001 -> 6.594   x1.65        median  x1.17  ->  15%
#     _69192_/ZN  4.918 -> 5.896   x1.20        p90     x1.23  ->  19%
#     _68972_/ZN  4.499 -> 5.534   x1.23        worst   x1.83  ->  45%
#     _69119_/ZN  4.241 -> 4.884   x1.15
#
# Required margin is m >= 100 * (1 - 1/ratio). 45 targets 2.2 ns during repair
# so the worst tail lands inside 4.0 ns after extraction.
#
# It does what it says. blockc_slew45 against blockc_mc, one variable, die
# pinned to 1477.7 um by a check that refuses to launch if it moved:
#
#     max-slew violations   826  ->    12      (-98.5%)
#     max-cap                 1  ->     0
#     setup WS           +20.597 -> +20.657 ns  (better)
#     hold WS            +0.0420 -> +0.0435 ns  (better)
#     logic area       1,359,799 -> 1,406,117   (+3.41%)
#     timing repair buffers 2154 ->  4401       (the mechanism, doubled)
#
# *** THE NETLIST DID NOT BOOT -- AND THE ORACLE WAS WRONG. 2026-08-13. ***
#
# Read this whole block before acting on the numbers above OR below.
#
# `blocka_reharden`, hardened with this margin, passes every check the flow
# has -- Magic DRC 0, KLayout DRC 0, LVS 0, XOR 0, antenna 0, routing DRC 0,
# setup +20.94 ns, hold +0.0667 ns -- and gate-level simulation of it never
# asserts the flash chip-select. The control, the original netlist at the
# default margin, reaches EXIT SUCCESS in 12 399 cycles.
#
# The bisect above closes the last escape route: PNR_CORNERS is inert, so this
# margin is the ONLY change standing between the netlist that boots and the one
# that does not. It is not a fix with a caveat; on present evidence it is a
# trade that costs function, and every slew number above describes a netlist
# whose usability is unestablished.
#
# najaeda's structural diff says where to look. Between the two netlists the
# `dlya_2` delay cells disappear ENTIRELY and `dlyb_1` drops by 155, while
# everything else that moves is buffers and fill. Repair removing delay cells
# on a design whose hold margin is 0.067 ns is the first hypothesis.
#
# *** RETRACTED SAME DAY: the boot failure is a SIMULATION ARTIFACT. ***
#
# The margin ladder, all at the mandated 1117.5 um die, one variable, same RTL
# bundle, each netlist gate-level simulated:
#
#     margin   max-slew   logic area     dlya_2   GLS
#       10          591    950,908 um2      1      PASS   12,399 cycles
#       20          260    952,590 (+0.18%) 1      PASS   12,399 cycles
#       32           56    959,888 (+0.94%) 1      PASS   12,399 cycles
#       45            4    976,364 (+2.68%) 0      FAIL   hangs, csb never asserts
#
# The boot failure tracks one cell exactly. But that cell is not missing -- the
# resizer SWAPPED it: instance _28773_ is `dlya_2` in every booting netlist and
# `clkbuf_1` in the failing one, same input net, same output net. Both are
# non-inverting buffers, so in a ZERO-DELAY simulation that swap is a no-op.
#
# So the difference was compared properly, per instance. Strip drive strength
# and every one of the three netlists holds the SAME 36,572 logic instances --
# identical names, identical functions, zero diff. Everything that differs is
# buffer, inverter, delay, clkbuf or fill, and all of those are TRANSPARENT in
# zero delay.
#
# Which means the three netlists must behave identically under this testbench,
# and one of them does not. The oracle is what is broken, not the netlist:
# these flops are UDP sequential primitives compiled -DFUNCTIONAL, which strips
# the specify blocks carrying the CLK->Q delay. Zero clock-to-Q with UDP flops
# is the textbook race: what a flop samples depends on the simulator's event
# ordering, and buffering changes that ordering without changing logic.
#
# CONSEQUENCE: there is NO measured evidence that any margin breaks this
# design. The 591 -> 4 reduction stands as a real result. What does not stand
# is "45 is unsafe" -- that was my conclusion this morning and it was built on
# an oracle that cannot distinguish these netlists in the first place.
#
# What is still unproved: I compared instance sets, not the connectivity graph.
# A rewiring that preserved every instance would not show up. That is exactly
# what formal equivalence would settle, and SEC cannot currently load this
# design (see flow/librelane/scripts/run_lec.sh).
#
# ---- SETTLED 2026-09-07: IT WAS THE TESTBENCH, AND 45 BOOTS -----------------
#
# The paragraph above named the right conclusion ("no evidence any margin
# breaks this design") and the wrong mechanism. Removing the zero clock-to-Q
# race changed nothing: blocka_reharden failed at c2q = 0, 0.1, 1, 2 and 5 ns
# while the control booted in 12,399 cycles at every one.
#
# The "still unproved" above is now proved: buffer chains collapsed, the two
# netlists have 0 driver mismatches across 76,910 input pins, 73 cell-type
# differences that are all drive-strength resizes or clkinv<->inv (byte-
# identical models), and the same clock and reset cones. They are equivalent.
#
# It was gls_tb.sv. It deasserted rst_n in the same timestep as the capture
# edge, so every dffrnq/dffsnq saw RN rise as CLK rose and the winner was
# decided by the delta-cycle depth of the reset tree versus the clock tree --
# both zero-delay, so that depth is the BUFFER COUNT. Released half a cycle
# away:
#
#     blocka_signoff  (margin 10)   PASS 12,399  ->  PASS 12,400
#     blocka_reharden (margin 45)   FAIL 40,001  ->  PASS 12,400
#
# 45 IS EXONERATED. Both boot, to the same cycle.
#
# DECIDED 2026-08-13: SHIP 32 -- and the reasoning below is now obsolete.
#
# 45 is not known-unsafe -- that conclusion was retracted, and there is no
# sound evidence against it. 32 is chosen because it is the best result that
# passes every check we can actually trust, at a cost that rounds to nothing:
# 90.5% fewer max-slew violations for 0.94% more cell area, with setup and hold
# both marginally better than the taped-out design.
#
# ^ EVERY REASON IN THAT PARAGRAPH WAS PROCEDURAL. "Passes every check we can
# actually trust" was the tiebreaker, and the check it referred to was broken.
# 32 remains the shipped value and is defensible on area alone (+0.94% for
# -90.5%, versus +2.68% for -99.3% at 45), but it is now an ordinary trade,
# not a safety argument. Do not read the ladder above and conclude that 45 was
# ruled out on merit. Tracked on the board as reopened.
#
# The remaining 56 are the tail this flow cannot reach without a post-route
# repair step, which would invalidate the routes. Note what the last stretch to
# 4 actually bought at margin 45: all four survivors there were PADS, whose
# transition is set by OUTPUT_CAP_LOAD -- 72.91 fF, a LibreLane default nobody
# measured for this board -- and not by internal buffering. So the tail beyond
# 32 was never an internal design fix in the first place.
#
# Raise it above 32 only with an oracle that can distinguish netlists differing
# solely in buffering. Today's cannot.
#
# NEXT: fix the oracle, not the margin. Unit-delay or timing-annotated GLS
# would remove the race class entirely; today Icarus refuses -gspecify on these
# models ("ifnone with an edge-sensitive path is not supported"). Until then no
# margin above 32 can be either cleared or condemned on evidence.
#
# ^ THAT BLOCKER IS GONE (2026-09-07) AND THE VALUE IS NOW 45.
#
# The gate that condemned 45 was gls_tb.sv releasing async reset in the same
# timestep as the capture edge, which made the verdict depend on the buffer
# depth of the reset tree against the clock tree. Released half a cycle away,
# blocka_reharden -- the margin-45 netlist -- boots in 12,400 cycles, the SAME
# cycle as the control. All three designs boot at this margin.
#
# So the choice stopped being a safety question and became an area trade, and
# 45 wins it on the numbers this project measured:
#
#     margin   max-slew (blanket 4.0 ns)   logic area
#       10        591 / 845 / 826          baseline
#       32         56 /  17 /  49          +0.94% / +0.86% / +1.25%
#       45          4 /   5 /  12          +2.68% / +2.84% / +3.41%
#
# Under per-pin liberty limits (SIGNOFF_SDC_FILE) all of these read zero, so
# the counts above are a RELATIVE measure of repair quality, not a defect
# count. The last stretch costs ~2% area for ~4x fewer marginal-slew pins, on
# a design whose die is mandated and whose utilisation has headroom.
#
# NOTE the asymmetry this replaces: DESIGN_REPAIR_MAX_SLEW_PCT (post-GPL, on
# the crudest estimates) was 20 while the post-GRT repair -- the LAST one
# before routing -- was 10. The least conservative margin sat closest to the
# thing it could not see. Post-GPL stays at 20 so runs change one variable.
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 45

# Cluster at most 10 sinks per clock leaf, matching MAX_FANOUT_CONSTRAINT.
# This is what took max-fanout violations from 411 to 1.
CTS_SINK_CLUSTERING_SIZE: 10
# CTS_MAX_CAP is deliberately NOT set. Forcing 0.15 pF in the previous pass
# over-constrained the leaves without touching the trunk buffers on gated-clock
# roots, and made max-cap WORSE (27 -> 35) by concentrating load on them.

# ---- MEASURE AGAINST THE LIBRARY, NOT A BLANKET DEFAULT ----------------------
# The previous pass chased 2 889 max-slew and 35 max-cap violations with
# buffers. Most of them were not electrically real. What the PDK actually says:
#
#   * max_transition is declared PER INPUT PIN and PER CORNER -- 836
#     declarations per library file. It is 4.0 ns at tt_025C_5v00, 7.0 ns at
#     ss_125C_4v50 and 2.6 ns at ff_n40C_5v50.
#   * max_capacitance is PER CELL, from 0.2394 pF (clkbuf_1) to 4.756 pF
#     (clkbuf_20); clkbuf_16 is 3.813 pF
#
# CORRECTED 2026-08-16. This block used to read "every one of the 215 cells
# declares max_transition : 4.0 ns". That is true only at tt_025C_5v00. It also
# claimed elsewhere that "the largest characterised input transition is
# 4.756 ns" -- 4.756 is the largest max_capacitance in the tt library, in pF,
# and the transition tables (index_1) run to 10.0 ns in every 5v0 corner.
#
# LibreLane's defaults were MAX_TRANSITION_CONSTRAINT 3 ns and a blanket
# set_max_capacitance of 0.2 pF on the whole design -- the latter tighter than
# EVERY cell's own limit, including the weakest clock buffer. That is why the
# worst "violation" was a clkbuf_16 flagged at 0.443 pF while being rated for
# 3.813 pF: a cell at 12% of its capability, reported as failing.
#
# So the constraint is set to the library's own number rather than under it.
# This is not relaxing a limit to make a report green -- it stops the flow
# spending area on nets that were never failing, so repair can work on the ones
# that are.
#
# RESOLVED 2026-08-16: 4.0 is kept, but it is now a PnR TARGET ONLY. Signoff
# checks each pin against its own liberty limit -- see SIGNOFF_SDC_FILE below.
#
# The problem it had: max_transition is declared per input pin AND per corner
# (4.0 tt / 7.0 ss / 2.6 ff), and `set_max_transition 4.0 [current_design]`
# applied the TYPICAL corner's number at all nine. Every max-slew violation
# this project counted was at an ss_125C_4v50 corner, where pins are rated to
# 7.0 ns. Same pin, same netlist, same parasitics, OpenSTA 2.7.0:
#
#     shipped SDC        _56916_/ZN  limit 4.00  slew 5.664  -1.664  VIOLATED
#     library per-pin    _56916_/ZN  limit 7.00  slew 5.664  +1.34   MET
#
# The obvious fix -- setting this to null, as MAX_CAPACITANCE_CONSTRAINT is --
# WAS TRIED AND IS WRONG. runs/blocka_libtran: PnR then stops targeting 4.0,
# the design loses buffering, and it degrades past the LIBRARY's own limits:
#
#     blocka_slew32 (4.0)   56 slew / 0 cap   959,888 um2   no real violations
#     blocka_libtran (null) 10 slew / 5 cap   930,098 um2   REAL: 7.1998 ns
#                                             (-3.10%)      against a 7.0 limit,
#                                                           cap vs per-cell lib
#
# So the 3.10% of area this constraint costs is NOT waste -- it is what keeps
# the design inside the library's qualified range. The constraint was never the
# problem; measuring SIGNOFF against it was. Keep 4.0 here so the optimiser
# keeps working, and let signoff use the real limits.
MAX_TRANSITION_CONSTRAINT: 4

# ---- SIGN OFF AGAINST THE LIMIT THE CELLS ARE QUALIFIED TO --------------------
# PnR keeps the 4.0 ns target above (PNR_SDC_FILE stays unset, so every
# implementation step uses LibreLane's base.sdc unchanged). Post-PnR STA uses
# this file instead, which is base.sdc with the blanket set_max_transition
# removed, so each pin is checked against its own liberty max_transition at its
# own corner.
#
# This is ordinary guardbanding -- over-constrain the optimiser, sign off
# against the qualification limit -- and it is not a weaker gate. The same
# library-limit check CAUGHT the degraded blocka_libtran netlist: 10 max-slew
# and 5 max-capacitance violations. It stops reporting non-defects; it does not
# stop reporting defects.
#
# MEASURED (runs/blocka_sdc vs runs/blocka_slew32, one differing key):
#   post-PnR netlist   BYTE-IDENTICAL, md5 6d8ab8db6b7613b65f3232d33ef96a68
#   setup/hold WNS     identical to full precision
#   max-slew           56 -> 0        max-cap 0 -> 0     max-fanout 1 -> 1
#   adverse metrics    2  -> 1        (the remaining one is max-fanout)
#
# Byte-identical is the control that matters: it proves nothing leaked into
# PnR. If this file ever changes the netlist, the split has broken.
# `dir::` resolves against the RESOLVED config's directory, and that is no
# longer always experimental/: integration runs write theirs into
# flow/librelane/integration/. Naming ../experimental/ explicitly resolves
# correctly from both and keeps ONE copy of this file, which matters because
# a second copy of a signoff SDC is a second thing to keep in step.
SIGNOFF_SDC_FILE: dir::../experimental/signoff_library_limits.sdc
# Unset: let each cell's own liberty max_capacitance apply. base.sdc only calls
# set_max_capacitance `if {[info exists ...]}`, so a null here means per-cell
# limits govern instead of one blanket number.
MAX_CAPACITANCE_CONSTRAINT: null

PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# 20 MHz. The GF180 SRAM cut specifies Tcyc = 55.6 ns (~18 MHz), so the whole
# design is paced by the scratchpad, not by the cores. Asking for the 50 MHz of
# config_classic.yaml here would be asking the tool to close something the
# macro cannot do.
CLOCK_PORT: clk_i

VDD_NETS: [VDD]
GND_NETS: [VSS]
PL_TARGET_DENSITY_PCT: 76
GRT_ALLOW_CONGESTION: true

# Measured hold WNS was +0.33 to +1.53 ns, i.e. margin to give back.
PL_RESIZER_HOLD_SLACK_MARGIN: 0.05
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.05

# ---- LET ANTENNA REPAIR FINISH -----------------------------------------------
# mosaic_block_c came out of routing with ONE antenna violation (P/R 1.31,
# Metal3 side-area 525.65 against a 400 limit, at fanout1689/I on
# cpu_0_0.i_servile.o_rf_raddr[2]). The post-GRT repair had left zero; detailed
# routing created it. Same shape as the slew problem: repair works against
# estimated geometry, routing then changes it.
#
# But this one is not a margin problem. The post-DRT repair loop in
# librelane/scripts/openroad/drt.tcl is:
#
#     while {$i <= $::env(DRT_ANTENNA_REPAIR_ITERS) && [log_cmd check_antennas]} {
#
# Tcl's && short-circuits. What the three runs at repair margin 32 did:
#
#     A  iter1 found 5   iter2 found 1   -> check_antennas: 0 violations, exit
#     B  iter1 found 3                   -> check_antennas: 0 violations, exit
#     C  iter1 found 10  iter2 found 2   iter3 found 2  -> i=4, LOOP CUT OFF
#
# On Block C the final check_antennas was never evaluated at all: the log goes
# straight from "Post processing" to "Updating metrics". Block C did not fail
# to converge -- it was never asked. The separate CheckAntennas step asked
# afterwards and found the one remaining.
#
# So the default of 3 is a cap this design hit, not a result it reached. 8 is
# not a guess at how many it needs: iterations are only consumed while
# violations remain, so the loop still exits the moment check_antennas returns
# 0 and the extra headroom costs nothing on a design that converges.
#
# A and B are provably unaffected. Both exited on check_antennas == 0, which
# does not depend on the cap; raising it can only add a re-check that returns
# 0 immediately. No re-route, no diode, same netlist.
#
# MEASURED (runs/blockc_ant8, 2026-08-16). The cap was off by ONE:
#
#     iter1 found 8 -> 10 diodes     iter3 found 2 -> 2 diodes
#     iter2 found 2 ->  2 diodes     iter4 found 1 -> 1 diode
#     check_antennas: 0 net violations, 0 pin violations -- converged
#
# route__antenna_violation__count 1 -> 0. The control was tight: same pinned
# RTL bundle, same DIE_AREA, byte-identical synthesised netlist, one differing
# config key. The whole cost of closing it:
#
#     antenna cells   18 -> 19        (+4.39 um2, +0.0003% of cell area)
#     instances    68047 -> 68048
#     setup WNS / hold WNS            IDENTICAL to full precision
#     max-slew 49, max-fanout 4       unchanged
#     DRT step     1 h 03 -> 1 h 13   (one extra routing pass)
#
# Every other hard check stayed 0. One diode and ten minutes; it did not need
# heuristic diode insertion, a repair margin, or a waiver.
DRT_ANTENNA_REPAIR_ITERS: 8
# DRT_ANTENNA_REPAIR_MARGIN IS INERT -- do not set it expecting an effect.
# LibreLane declares it on the DetailedRouting step, but no script reads it:
# both antenna_repair.tcl (post-GRT) and drt.tcl (post-DRT) pass
# `-ratio_margin $::env(GRT_ANTENNA_REPAIR_MARGIN)`. So the GRT-named variable
# governs BOTH repair stages and the DRT-named one governs nothing. Second
# inert variable found in this flow, after PNR_CORNERS. If over-repair margin
# is ever needed post-DRT, raise GRT_ANTENNA_REPAIR_MARGIN (default 10) and
# accept that it moves the post-GRT stage too.

PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# CORE RING RESTORED -- IR drop cannot be analysed without it.
#
# PDN_CORE_RING: false gave OpenROAD PSM no power source: "PSM-0069 Check
# connectivity failed on VSS", 101354 power-grid violations. Signoff needs the
# ring back, but the two obvious placements both fail:
#   Metal2/Metal3 -> inside the router's own layer range (RT_MIN_LAYER Metal2,
#                    RT_MAX_LAYER Metal5). Every detailed-routing violation
#                    became a signal-to-VDD short on Metal3 along the ring.
#   Metal4/Metal5 explicitly via PDN_CORE_{VERTICAL,HORIZONTAL}_LAYER ->
#                    "PDN-0186 Connect between layers Metal4 and Metal5 already
#                    exists in stdcell_grid".
#
# The fix is to NOT set PDN_CORE_*_LAYER at all. The PDN config script then
# defaults the ring to PDN_VERTICAL/HORIZONTAL_LAYER (Metal4/Metal5, above the
# router) and the three extra add_pdn_connect calls stay guarded behind
# `info exists`, so no duplicate connect is emitted.
#
# PDN_CFG IS DELIBERATELY UNSET. Pointing it at ../pdn_cfg.tcl killed the first
# signoff attempt at step 21 with "[PDN-1028] Either -instances, -cells, or
# -default must be specified": that file is LibreLane's own script plus a
# MOSAIC sram_grid appendix whose define_pdn_grid -macro named none of the
# three. It is fixed now, but Block A binds no macro at all, so the built-in
# script is both sufficient and one fewer variable. The core-ring logic quoted
# above is LibreLane's and is identical either way.
PDN_CORE_RING: true
PDN_CORE_RING_VWIDTH: 3
PDN_CORE_RING_HWIDTH: 3
PDN_CORE_RING_VSPACING: 2
PDN_CORE_RING_HSPACING: 2
PDN_CORE_RING_VOFFSET: 2
PDN_CORE_RING_HOFFSET: 2

# The 256 B scratchpad: four 64x8 cuts, one per byte lane.

# ---- SIGNOFF -----------------------------------------------------------------
# Magic DRC must fail the flow on a real violation.
ERROR_ON_MAGIC_DRC: true
ERROR_ON_LINTER_WARNINGS: false

# Inherited from config_classic.yaml: these suppress GF180 SRAM-macro DRC false
# positives. This design binds no SRAM macro (128 B scratchpad is flip-flops),
# so they are inert here -- kept only so a later macro-backed variant does not
# rediscover them.
MAGIC_GDS_FLATGLOB:
- "*_CDNS_*"
- "*$$*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"

KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true
